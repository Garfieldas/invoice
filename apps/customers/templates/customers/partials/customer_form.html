  <form method="post" novalidate class="card bg-base-100 shadow p-6 mb-4">
    {% csrf_token %}
    <div class="card-body space-y-6">
      {% if form.non_field_errors %}
      <div class="alert alert-error">
        {{ form.non_field_errors }}
      </div>
      {% endif %}

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        {% for field in form %}
        <div class="flex flex-col">
          <label for="{{ field.id_for_label }}" class="label">
            <span class="label-text text-sm font-semibold">{{ field.label }}</span>
          </label>
          {{ field }}
          {% if field.errors %}
            <p class="text-error text-sm mt-1">{{ field.errors }}</p>
          {% endif %}
        </div>
        {% endfor %}
      </div>
    {% include 'components/notifications.html' %}

        <div class="flex justify-end gap-2">
          <a href="{% url 'customers' %}" class="btn btn-ghost">Back</a>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
    </div>
  </form>
