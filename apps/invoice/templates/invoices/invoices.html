{% extends 'base.html' %}
{% block content %}

<div class="p-6 max-w-3xl mx-auto">
  <div class="flex items-center justify-between mb-6">
    <div>
      <h1 class="text-3xl font-bold">Invoices</h1>
      <p class="text-sm text-base-content/60">Manage your invoices</p>
    </div>
    <div>
      <a href="{% url 'create-invoice' %}" class="btn btn-primary gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
        </svg>
        Add invoice
      </a>
    </div>
  </div>

  <div class="bg-base-100 shadow">
    {% if invoices %}
      {% include 'invoices/partials/invoices_table.html' %}
    {% else %}
      <div class="p-8 text-center">
        <h3 class="text-xl font-semibold mb-2">No invoices yet</h3>
        <p class="text-sm text-base-content/60 mb-4">Create invoices...</p>
      </div>
    {% endif %}
  </div>
</div>

{% endblock %}
