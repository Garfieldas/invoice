{% extends 'base.html' %}
{% block content %}
<div class="min-h-screen flex items-center justify-center bg-base-200 p-6">
  <div class="w-full max-w-md">
    <div class="text-center mb-6">
      <h1 class="text-3xl font-bold">Password reset complete</h1>
      <p class="text-sm text-base-content/60">Your password has been set. You can now sign in with your new password.</p>
    </div>

    <div class="card bg-base-100 shadow-lg overflow-hidden">
      <div class="card-body p-8">
        <div class="flex flex-col gap-3">
          <a href="{% url 'login' %}" class="btn btn-primary w-full">Return to sign in</a>
        </div>
      </div>
    </div>

    {% include 'partials/notifications.html' %}
  </div>
</div>
{% endblock %}
