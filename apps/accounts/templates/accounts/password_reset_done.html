{% extends 'base.html' %}
{% block content %}
<div class="min-h-screen flex items-center justify-center bg-base-200 p-6">
	<div class="w-full max-w-md">
		<div class="text-center mb-6">
			<h1 class="text-3xl font-bold">Check your email</h1>
			<p class="text-sm text-base-content/60">We've sent instructions to reset your password, if an account with that email exists.</p>
		</div>

		<div class="card bg-base-100 shadow-lg overflow-hidden">
			<div class="card-body p-8">
				<p class="mb-6">If you don't receive an email, check your spam folder or try again.</p>

				<div class="flex flex-col gap-3">
					<a href="{% url 'login' %}" class="btn btn-primary w-full">Return to sign in</a>
				</div>
			</div>
		</div>

		{% include 'partials/notifications.html' %}
	</div>
</div>
{% endblock %}
