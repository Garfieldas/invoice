<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Invoice App</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>         
</head>

<body class="bg-base-200">

<div class="drawer lg:drawer-open">
    <input id="my-drawer" type="checkbox" class="drawer-toggle" />
    <div class="drawer-content flex flex-col">
        <div class="navbar bg-base-100 border-b border-base-300">
            <div class="flex-none lg:hidden">
                <label for="my-drawer" class="btn btn-square btn-ghost">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none"
                        viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                </label>
            </div>

            <div class="flex-1">
                <h1 class="text-xl font-semibold">Dashboard</h1>
            </div>

            <div class="flex-none hidden lg:flex">
                <button class="btn btn-primary btn-sm">New Invoice</button>

                <div class="avatar ml-4">
                    <div class="w-10 rounded-full">
                        <img src="https://i.pravatar.cc/300" />
                    </div>
                </div>
            </div>
        </div>
        <div class="p-6 space-y-6">

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="stats shadow bg-base-100">
                    <div class="stat">
                        <div class="stat-title">Total Invoices</div>
                        <div class="stat-value text-primary">127</div>
                    </div>
                </div>

                <div class="stats shadow bg-base-100">
                    <div class="stat">
                        <div class="stat-title">Paid This Month</div>
                        <div class="stat-value text-success">€1,420</div>
                    </div>
                </div>

                <div class="stats shadow bg-base-100">
                    <div class="stat">
                        <div class="stat-title">Pending</div>
                        <div class="stat-value text-warning">6</div>
                    </div>
                </div>
            </div>
            <div class="card bg-base-100 shadow">
                <div class="card-body">
                    <h2 class="card-title">Recent Invoices</h2>

                    <div class="overflow-x-auto">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>Customer</th>
                                    <th>Date</th>
                                    <th>Total</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>102</td>
                                    <td>Jonas</td>
                                    <td>2025-01-01</td>
                                    <td>€120</td>
                                    <td><span class="badge badge-success">Paid</span></td>
                                </tr>
                                <tr>
                                    <td>103</td>
                                    <td>UAB Baltika</td>
                                    <td>2025-01-03</td>
                                    <td>€64</td>
                                    <td><span class="badge badge-warning">Pending</span></td>
                                </tr>
                                <tr>
                                    <td>104</td>
                                    <td>Mantas</td>
                                    <td>2025-01-04</td>
                                    <td>€89</td>
                                    <td><span class="badge badge-error">Overdue</span></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                </div>
            </div>

        </div>

    </div>
    <div class="drawer-side">
        <label for="my-drawer" class="drawer-overlay"></label>

        <aside class="w-64 min-h-full bg-base-100 border-r border-base-300 shadow-lg">

            <div class="p-4 text-2xl font-bold border-b border-base-300 flex items-center gap-2">
                <span class="text-primary">📄</span> InvoiceApp
            </div>

            <nav class="p-4 space-y-1">
                <a class="btn btn-ghost w-full justify-start">🏠 Dashboard</a>
                <a class="btn btn-ghost w-full justify-start">🧾 All Invoices</a>
                <a class="btn btn-ghost w-full justify-start">➕ Create Invoice</a>
                <a class="btn btn-ghost w-full justify-start">👥 Customers</a>
                <a class="btn btn-ghost w-full justify-start">⚙️ Settings</a>
            </nav>

            <div class="p-4 border-t border-base-300">
                <button class="btn btn-outline btn-sm w-full">Logout</button>
            </div>

        </aside>
    </div>

</div>

</body>
</html>
