version: "3.8"
services:
  redis:
    image: redis:6-alpine
    container_name: redis

  web:
    build: .
    volumes:
      - .:/app
    container_name: django_app
    ports:
      - "8000:8000"
      - "5678:5678"
    image: app:django
    command: python manage.py runserver 0.0.0.0:8000
    env_file:
      - .env
    depends_on:
      - redis

  rq_worker:
    build: .
    volumes:
      - .:/app
    container_name: rq_worker
    command: python manage.py rqworker --with-scheduler
    depends_on:
      - redis
      - web